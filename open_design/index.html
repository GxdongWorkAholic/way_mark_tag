<script>
(function () {
  'use strict';

  var STORE_KEY = 'waymarktag-start.v1';
  var THEMES = ['light', 'dark'];
  var ENGINES = [
    { id: 'google', name: 'Google', url: 'https://www.google.com/search?q=' },
    { id: 'baidu', name: 'Baidu', url: 'https://www.baidu.com/s?wd=' }
  ];

  function linkNode(url, label) { return { label: label || '', url: url }; }
  function siteNode(id, name, links) { return { id: id, type: 'site', name: name, links: links }; }
  function folderNode(id, name, items) { return { id: id, type: 'folder', name: name, items: items }; }

  var DEFAULT_PAGES = [
    {
      id: 'page-daily',
      name: '日常',
      items: [
        siteNode('site-deepseek', 'DeepSeek', [
          linkNode('https://chat.deepseek.com', 'Chat'),
          linkNode('https://platform.deepseek.com', 'Platform')
        ]),
        siteNode('site-github', 'GitHub', [linkNode('https://github.com')]),
        siteNode('site-zhihu', '知乎', [linkNode('https://www.zhihu.com')]),
        siteNode('site-bilibili', '哔哩哔哩', [linkNode('https://www.bilibili.com')]),
        siteNode('site-sspai', '少数派', [linkNode('https://sspai.com')]),
        siteNode('site-douban', '豆瓣', [linkNode('https://www.douban.com')]),
        siteNode('site-figma', 'Figma', [linkNode('https://www.figma.com')]),
        siteNode('site-notion', 'Notion', [linkNode('https://www.notion.so')])
      ]
    },
    {
      id: 'page-work',
      name: '工作',
      items: [
        folderNode('folder-dev', '开发', [
          siteNode('site-mdn', 'MDN', [linkNode('https://developer.mozilla.org')]),
          siteNode('site-so', 'Stack Overflow', [linkNode('https://stackoverflow.com')]),
          folderNode('folder-fe', '前端', [
            siteNode('site-caniuse', 'Can I use', [linkNode('https://caniuse.com')]),
            siteNode('site-csstricks', 'CSS-Tricks', [linkNode('https://css-tricks.com')])
          ])
        ]),
        siteNode('site-github-work', 'GitHub', [linkNode('https://github.com')]),
        siteNode('site-linear', 'Linear', [linkNode('https://linear.app')]),
        siteNode('site-slack', 'Slack', [linkNode('https://slack.com')])
      ]
    }
  ];

  var DEFAULTS = {
    version: 3,
    theme: 'light',
    engine: 'google',
    pages: DEFAULT_PAGES
  };

  var $ = function (sel, root) { return (root || document).querySelector(sel); };

  var docEl = document.documentElement;
  var pageTabs = $('#pageTabs');
  var tileGrid = $('#tileGrid');
  var boardEmpty = $('#boardEmpty');
  var boardViewport = $('#boardViewport');
  var boardEl = $('#board');
  var crumbEl = $('#crumb');
  var prevBtn = $('#prevPage');
  var nextBtn = $('#nextPage');
  var engineBtn = $('#engineBtn');
  var engineLabel = $('#engineLabel');
  var engineMenu = $('#engineMenu');
  var engineBox = $('#engineBox');
  var searchForm = $('#searchForm');
  var searchInput = $('#searchInput');
  var siteDialog = $('#siteDialog');
  var siteForm = $('#siteForm');
  var siteTitle = $('#siteTitle');
  var siteName = $('#siteName');
  var linkList = $('#linkList');
  var addLinkBtn = $('#addLinkBtn');
  var siteLinksError = $('#siteLinksError');
  var promptDialog = $('#promptDialog');
  var promptForm = $('#promptForm');
  var promptTitle = $('#promptTitle');
  var promptLabel = $('#promptLabel');
  var promptInput = $('#promptInput');
  var promptError = $('#promptError');
  var settingsDialog = $('#settingsDialog');
  var pageManage = $('#pageManage');
  var addPageBtn = $('#addPageBtn');
  var engineSelect = $('#engineSelect');
  var importFile = $('#importFile');
  var confirmDialog = $('#confirmDialog');
  var confirmTitle = $('#confirmTitle');
  var confirmMsg = $('#confirmMsg');
  var confirmOk = $('#confirmOk');
  var toastEl = $('#toast');
  var linkMenu = $('#linkMenu');
  var ctxMenu = $('#ctxMenu');
  var moveDialog = $('#moveDialog');
  var moveTitle = $('#moveTitle');
  var moveNote = $('#moveNote');
  var moveTree = $('#moveTree');
  var moveConfirm = $('#moveConfirm');

  var state = loadState();
  var nav = { pageId: state.pages[0].id, path: [] };

  var editingSiteId = null;
  var confirmHandler = null;
  var promptHandler = null;
  var toastTimer = null;
  var activeLinkMenu = null;
  var dragState = null;
  var dropTarget = null;
  var suppressClick = false;
  var longPressTimer = null;
  var transfer = null;

  var FOLDER_SVG = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l1.8 2.2h8A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/></svg>';
  var REMOVE_SVG = '<svg class="od-icon icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  var BACK_SVG = '<svg class="od-icon icon-13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>';
  var CHEVRON_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  var PAGE_SVG = '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M4 10h16M10 10v10"/></svg>';

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function uid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function normalizeUrl(value) {
    var raw = String(value || '').trim();
    if (!raw) return null;
    var candidate = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw) ? raw : 'https://' + raw;
    try {
      var parsed = new URL(candidate);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
      if (!parsed.hostname || parsed.hostname.indexOf('.') === -1) return null;
      return parsed.href;
    } catch (e) {
      return null;
    }
  }

  function normalizeLink(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var url = normalizeUrl(raw.url);
    if (!url) return null;
    var label = typeof raw.label === 'string' ? raw.label.trim().slice(0, 10) : '';
    return { label: label, url: url };
  }

  function sanitize(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var seen = {};

    function takeId(value) {
      var id = (typeof value === 'string' && value) ? value.slice(0, 64) : uid();
      if (seen[id]) id = uid();
      seen[id] = true;
      return id;
    }

    function cleanNode(value, depth) {
      if (!value || typeof value !== 'object') return null;
      var name = typeof value.name === 'string' ? value.name.trim().slice(0, 16) : '';
      if (!name) return null;

      if (value.type === 'folder') {
        if (depth > 12) return null;
        var items = [];
        if (Array.isArray(value.items)) {
          for (var i = 0; i < value.items.length; i += 1) {
            var child = cleanNode(value.items[i], depth + 1);
            if (child) items.push(child);
          }
        }
        return { id: takeId(value.id), type: 'folder', name: name, items: items };
      }

      var links = [];
      if (Array.isArray(value.links)) {
        for (var j = 0; j < value.links.length; j += 1) {
          var link = normalizeLink(value.links[j]);
          if (link) links.push(link);
        }
      } else if (typeof value.url === 'string') {
        var legacy = normalizeUrl(value.url);
        if (legacy) links.push({ label: '', url: legacy });
      }
      if (!links.length) return null;

      return { id: takeId(value.id), type: 'site', name: name, links: links };
    }

    function cleanPage(value) {
      if (!value || typeof value !== 'object') return null;
      var name = typeof value.name === 'string' ? value.name.trim().slice(0, 16) : '';
      if (!name) name = '分页';
      var items = [];
      if (Array.isArray(value.items)) {
        for (var i = 0; i < value.items.length; i += 1) {
          var node = cleanNode(value.items[i], 0);
          if (node) items.push(node);
        }
      }
      return { id: takeId(value.id), name: name, items: items };
    }

    var pages = [];
    if (Array.isArray(raw.pages)) {
      for (var p = 0; p < raw.pages.length; p += 1) {
        var page = cleanPage(raw.pages[p]);
        if (page) pages.push(page);
      }
    } else if (Array.isArray(raw.shortcuts)) {
      var oldItems = [];
      for (var s = 0; s < raw.shortcuts.length; s += 1) {
        var oldNode = cleanNode(raw.shortcuts[s], 0);
        if (oldNode) oldItems.push(oldNode);
      }
      if (oldItems.length) {
        pages.push({ id: takeId(), name: '分页 1', items: oldItems });
      }
    }

    if (!pages.length) return null;

    return {
      version: 3,
      theme: THEMES.indexOf(raw.theme) >= 0 ? raw.theme : 'light',
      engine: ENGINES.some(function (e) { return e.id === raw.engine; }) ? raw.engine : 'google',
      pages: pages
    };
  }

  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        var parsed = sanitize(JSON.parse(raw));
        if (parsed) return parsed;
      } catch (e) {}
    }
    return clone(DEFAULTS);
  }

  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2600);
  }

  function suppressNextClick() {
    suppressClick = true;
    window.setTimeout(function () { suppressClick = false; }, 400);
  }

  /* ---------- data helpers ---------- */

  function findPage(id) {
    for (var i = 0; i < state.pages.length; i += 1) {
      if (state.pages[i].id === id) return state.pages[i];
    }
    return null;
  }

  function findNodeIn(items, id) {
    for (var i = 0; i < items.length; i += 1) {
      if (items[i].id === id) return items[i];
      if (items[i].type === 'folder') {
        var found = findNodeIn(items[i].items, id);
        if (found) return found;
      }
    }
    return null;
  }

  function findNode(id) {
    for (var p = 0; p < state.pages.length; p += 1) {
      var found = findNodeIn(state.pages[p].items, id);
      if (found) return found;
    }
    return null;
  }

  function countNodes(items) {
    var total = 0;
    for (var i = 0; i < items.length; i += 1) {
      total += 1;
      if (items[i].type === 'folder') total += countNodes(items[i].items);
    }
    return total;
  }

  function currentPage() {
    return findPage(nav.pageId) || state.pages[0];
  }

  function currentItems() {
    var items = currentPage().items;
    for (var i = 0; i < nav.path.length; i += 1) {
      var folder = null;
      for (var j = 0; j < items.length; j += 1) {
        if (items[j].id === nav.path[i] && items[j].type === 'folder') {
          folder = items[j];
          break;
        }
      }
      if (!folder) {
        nav.path = nav.path.slice(0, i);
        break;
      }
      items = folder.items;
    }
    return items;
  }

  function ensureNav() {
    if (!findPage(nav.pageId)) nav.pageId = state.pages[0].id;
    currentItems();
  }

  /* ---------- theme & engine ---------- */

  function applyTheme() {
    docEl.dataset.theme = state.theme;
    var radios = document.querySelectorAll('input[name="theme"]');
    for (var i = 0; i < radios.length; i += 1) {
      radios[i].checked = radios[i].value === state.theme;
    }
  }

  function currentEngine() {
    for (var i = 0; i < ENGINES.length; i += 1) {
      if (ENGINES[i].id === state.engine) return ENGINES[i];
    }
    return ENGINES[0];
  }

  function renderEngine() {
    var engine = currentEngine();
    if (!engineSelect.options.length) {
      ENGINES.forEach(function (item) {
        var opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name;
        engineSelect.appendChild(opt);
      });
    }
    engineLabel.textContent = engine.name;
    engineBtn.setAttribute('aria-label', '切换搜索引擎，当前' + engine.name);
    engineSelect.value = state.engine;

    engineMenu.textContent = '';
    ENGINES.forEach(function (item) {
      var option = document.createElement('button');
      option.type = 'button';
      option.className = 'engine-option';
      option.setAttribute('role', 'option');
      option.setAttribute('aria-selected', String(item.id === state.engine));
      option.dataset.engine = item.id;
      option.textContent = item.name;
      option.addEventListener('click', function () {
        selectEngine(item.id);
      });
      engineMenu.appendChild(option);
    });
  }

  function selectEngine(id) {
    if (!ENGINES.some(function (e) { return e.id === id; })) return;
    state.engine = id;
    saveState();
    renderEngine();
    closeEngineMenu();
    engineBtn.focus();
  }

  function openEngineMenu() {
    engineMenu.hidden = false;
    engineBtn.setAttribute('aria-expanded', 'true');
    var selected = engineMenu.querySelector('[aria-selected="true"]');
    if (selected) selected.focus();
  }

  function closeEngineMenu() {
    if (!engineMenu.hidden) {
      engineMenu.hidden = true;
      engineBtn.setAttribute('aria-expanded', 'false');
    }
  }

  engineBtn.addEventListener('click', function () {
    if (engineMenu.hidden) openEngineMenu();
    else closeEngineMenu();
  });

  document.addEventListener('click', function (event) {
    if (!engineBox.contains(event.target)) closeEngineMenu();
  });

  /* ---------- board rendering ---------- */

  function initialFor(name) {
    var chars = Array.from(String(name || '').trim());
    return chars.length ? chars[0].toUpperCase() : '?';
  }

  function renderPageTabs() {
    pageTabs.textContent = '';
    state.pages.forEach(function (page) {
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'page-tab';
      tab.dataset.pageTab = page.id;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', 'boardViewport');
      tab.setAttribute('aria-selected', String(page.id === nav.pageId));
      tab.draggable = false;
      tab.textContent = page.name;
      tab.title = page.name;
      pageTabs.appendChild(tab);
    });
    var active = pageTabs.querySelector('[aria-selected="true"]');
    if (active) {
      try { active.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
    }
  }

  function renderCrumb() {
    crumbEl.textContent = '';
    if (!nav.path.length) {
      crumbEl.hidden = true;
      return;
    }
    crumbEl.hidden = false;

    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'crumb-back';
    back.dataset.crumbBack = '';
    back.innerHTML = BACK_SVG + '<span>返回</span>';
    crumbEl.appendChild(back);

    var root = document.createElement('button');
    root.type = 'button';
    root.dataset.crumbIndex = '-1';
    root.textContent = currentPage().name;
    crumbEl.appendChild(root);

    var items = currentPage().items;
    nav.path.forEach(function (folderId, index) {
      var folder = null;
      for (var i = 0; i < items.length; i += 1) {
        if (items[i].id === folderId) { folder = items[i]; break; }
      }
      if (!folder) return;

      var sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '/';
      sep.setAttribute('aria-hidden', 'true');
      crumbEl.appendChild(sep);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.crumbIndex = String(index);
      btn.textContent = folder.name;
      if (index === nav.path.length - 1) btn.className = 'crumb-current';
      crumbEl.appendChild(btn);

      items = folder.items;
    });
  }

  function buildTile(node) {
    var li = document.createElement('li');
    li.className = 'tile-item';
    li.dataset.nodeId = node.id;
    li.dataset.nodeType = node.type;

    var tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile' + (node.type === 'folder' ? ' tile-folder' : '');
    tile.dataset.nodeId = node.id;
    tile.dataset.nodeType = node.type;
    tile.title = node.name;
    tile.draggable = false;

    var icon = document.createElement('span');
    icon.className = 'tile-icon';

    if (node.type === 'folder') {
      icon.innerHTML = FOLDER_SVG;
      tile.setAttribute('aria-label', '文件夹 ' + node.name + '，' + countNodes(node.items) + ' 个项目');
      if (node.items.length) {
        var fcount = document.createElement('span');
        fcount.className = 'tile-count';
        fcount.textContent = String(node.items.length);
        fcount.setAttribute('aria-hidden', 'true');
        icon.appendChild(fcount);
      }
    } else {
      icon.textContent = initialFor(node.name);
      tile.setAttribute('aria-label', node.name);
      if (node.links.length > 1) {
        var lcount = document.createElement('span');
        lcount.className = 'tile-count';
        lcount.textContent = String(node.links.length);
        lcount.setAttribute('aria-hidden', 'true');
        icon.appendChild(lcount);
      }
    }

    var label = document.createElement('span');
    label.className = 'tile-label';
    label.textContent = node.name;

    tile.appendChild(icon);
    tile.appendChild(label);
    li.appendChild(tile);
    return li;
  }

  function renderTiles(focusId) {
    closeLinkMenu();
    tileGrid.textContent = '';
    var items = currentItems();

    items.forEach(function (node) {
      tileGrid.appendChild(buildTile(node));
    });

    var empty = items.length === 0;
    tileGrid.hidden = empty;
    boardEmpty.hidden = !empty;
    if (empty) {
      boardEmpty.textContent = nav.path.length
        ? '这个文件夹还是空的 · 右键或长按空白处新增'
        : '这一页还是空的 · 右键或长按空白处新增';
    }

    boardViewport.setAttribute('aria-label', '常用网站，' + currentPage().name);

    if (focusId) {
      var target = tileGrid.querySelector('[data-node-id="' + focusId + '"]');
      if (target) {
        try { target.focus({ preventScroll: true }); } catch (e) { target.focus(); }
      }
    }
  }

  function renderBoard(focusId) {
    ensureNav();
    renderPageTabs();
    renderCrumb();
    renderTiles(focusId);
    renderArrows();
  }

  function renderArrows() {
    var index = -1;
    for (var i = 0; i < state.pages.length; i += 1) {
      if (state.pages[i].id === nav.pageId) { index = i; break; }
    }
    prevBtn.disabled = index <= 0;
    nextBtn.disabled = index < 0 || index >= state.pages.length - 1;
  }

  /* ---------- navigation ---------- */

  function goPage(delta) {
    var index = -1;
    for (var i = 0; i < state.pages.length; i += 1) {
      if (state.pages[i].id === nav.pageId) { index = i; break; }
    }
    if (index < 0) index = 0;
    var next = index + delta;
    if (next < 0 || next >= state.pages.length) return;
    nav.pageId = state.pages[next].id;
    nav.path = [];
    renderBoard();
  }

  function openUrl(url) {
    var anchor = document.createElement('a');
    anchor.href = url;
    anchor.target = '_blank';
    anchor.rel = 'noopener noreferrer';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
  }

  function activateNode(id) {
    var node = findNode(id);
    if (!node) return;
    if (node.type === 'folder') {
      nav.path.push(node.id);
      renderBoard();
      return;
    }
    if (node.links.length > 1) {
      var anchor = tileGrid.querySelector('[data-node-id="' + id + '"]');
      if (anchor) {
        openLinkMenu(node, anchor);
        return;
      }
    }
    openUrl(node.links[0].url);
  }

  /* ---------- page actions ---------- */

  function addPage() {
    askPrompt({
      title: '新增分页',
      label: '分页名称',
      value: '分页 ' + (state.pages.length + 1),
      onOk: function (name) {
        var page = { id: uid(), name: name, items: [] };
        state.pages.push(page);
        nav.pageId = page.id;
        nav.path = [];
        saveState();
        renderBoard();
        renderPageManager();
        toast('已新增分页');
      }
    });
  }

  function renamePage(page) {
    askPrompt({
      title: '重命名分页',
      label: '分页名称',
      value: page.name,
      onOk: function (name) {
        page.name = name;
        saveState();
        renderBoard();
        renderPageManager();
        toast('已重命名分页');
      }
    });
  }

  function deletePage(page) {
    if (state.pages.length <= 1) {
      toast('至少保留一个分页');
      return;
    }
    askConfirm({
      title: '删除分页',
      message: '「' + page.name + '」中的 ' + countNodes(page.items) + ' 个项目都会被删除。',
      okLabel: '删除',
      danger: true,
      onOk: function () {
        state.pages = state.pages.filter(function (item) { return item.id !== page.id; });
        if (nav.pageId === page.id) {
          nav.pageId = state.pages[0].id;
          nav.path = [];
        }
        saveState();
        renderBoard();
        renderPageManager();
        toast('已删除分页');
      }
    });
  }

  /* ---------- node actions ---------- */

  function createFolder() {
    askPrompt({
      title: '新增文件夹',
      label: '文件夹名称',
      value: '新建文件夹',
      onOk: function (name) {
        currentItems().push(folderNode(uid(), name, []));
        saveState();
        renderBoard();
        toast('已新增文件夹');
      }
    });
  }

  function renameFolder(node) {
    askPrompt({
      title: '重命名文件夹',
      label: '文件夹名称',
      value: node.name,
      onOk: function (name) {
        node.name = name;
        saveState();
        renderBoard();
        toast('已重命名文件夹');
      }
    });
  }

  function deleteNode(node) {
    var isFolder = node.type === 'folder';
    askConfirm({
      title: isFolder ? '删除文件夹' : '删除网站',
      message: isFolder
        ? '「' + node.name + '」及其中 ' + countNodes(node.items) + ' 个项目都会被删除。'
        : '「' + node.name + '」将从常用网站中移除。',
      okLabel: '删除',
      danger: true,
      onOk: function () {
        var items = currentItems();
        for (var i = 0; i < items.length; i += 1) {
          if (items[i].id === node.id) {
            items.splice(i, 1);
            break;
          }
        }
        saveState();
        renderBoard();
        toast(isFolder ? '已删除文件夹' : '已删除网站');
      }
    });
  }

  /* ---------- move / copy ---------- */

  function locateNode(nodeId) {
    function search(items, page, folder) {
      for (var i = 0; i < items.length; i += 1) {
        if (items[i].id === nodeId) {
          return { node: items[i], items: items, index: i, page: page, folder: folder };
        }
        if (items[i].type === 'folder') {
          var found = search(items[i].items, page, items[i]);
          if (found) return found;
        }
      }
      return null;
    }
    for (var p = 0; p < state.pages.length; p += 1) {
      var found = search(state.pages[p].items, state.pages[p], null);
      if (found) return found;
    }
    return null;
  }

  function destinationItems(target) {
    var page = findPage(target.pageId);
    if (!page) return null;
    if (!target.folderId) return page.items;
    var folder = findNode(target.folderId);
    if (!folder || folder.type !== 'folder') return null;
    return folder.items;
  }

  function regenerateIds(node) {
    node.id = uid();
    if (node.type === 'folder') {
      for (var i = 0; i < node.items.length; i += 1) regenerateIds(node.items[i]);
    }
  }

  function selectMoveTarget(button, pageId, folderId) {
    if (!transfer) return;
    transfer.target = { pageId: pageId, folderId: folderId };
    var picks = moveTree.querySelectorAll('.tree-pick');
    for (var i = 0; i < picks.length; i += 1) picks[i].setAttribute('aria-pressed', 'false');
    button.setAttribute('aria-pressed', 'true');
    moveConfirm.disabled = false;
  }

  function pickRow(options) {
    var pick = document.createElement('button');
    pick.type = 'button';
    pick.className = 'tree-pick';
    pick.setAttribute('aria-pressed', 'false');
    pick.dataset.pageId = options.pageId;
    if (options.folderId) pick.dataset.folderId = options.folderId;

    var icon = document.createElement('span');
    icon.className = 'tree-icon';
    icon.innerHTML = options.icon;
    icon.setAttribute('aria-hidden', 'true');

    var name = document.createElement('span');
    name.className = 'tree-name';
    name.textContent = options.name;

    var meta = document.createElement('span');
    meta.className = 'tree-meta';
    meta.textContent = options.meta;

    pick.appendChild(icon);
    pick.appendChild(name);
    pick.appendChild(meta);
    pick.addEventListener('click', function () {
      selectMoveTarget(pick, options.pageId, options.folderId || null);
    });
    return pick;
  }

  function folderTreeChildren(items, pageId) {
    var wrap = document.createElement('div');
    wrap.className = 'tree-children';
    var any = false;
    items.forEach(function (node) {
      if (node.type !== 'folder') return;
      if (transfer && transfer.nodeId === node.id) return;
      any = true;
      wrap.appendChild(folderTreeNode(node, pageId));
    });
    return any ? wrap : null;
  }

  function folderTreeNode(node, pageId) {
    var wrap = document.createElement('div');
    wrap.className = 'tree-node';

    var row = document.createElement('div');
    row.className = 'tree-row';

    var children = folderTreeChildren(node.items, pageId);
    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'tree-toggle';
    if (children) {
      toggle.innerHTML = CHEVRON_SVG;
      toggle.classList.add('is-open');
      toggle.setAttribute('aria-expanded', 'true');
      toggle.setAttribute('aria-label', '展开或折叠 ' + node.name);
      toggle.addEventListener('click', function () {
        var open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!open));
        toggle.classList.toggle('is-open', !open);
        children.hidden = open;
      });
    } else {
      toggle.classList.add('is-empty');
      toggle.setAttribute('aria-hidden', 'true');
      toggle.tabIndex = -1;
    }

    row.appendChild(toggle);
    row.appendChild(pickRow({
      pageId: pageId,
      folderId: node.id,
      name: node.name,
      meta: countNodes(node.items) + ' 项',
      icon: FOLDER_SVG
    }));
    wrap.appendChild(row);
    if (children) wrap.appendChild(children);
    return wrap;
  }

  function pageTreeNode(page) {
    var wrap = document.createElement('div');
    wrap.className = 'tree-node';

    var row = document.createElement('div');
    row.className = 'tree-row';

    var spacer = document.createElement('span');
    spacer.className = 'tree-toggle is-empty';
    spacer.setAttribute('aria-hidden', 'true');
    row.appendChild(spacer);

    row.appendChild(pickRow({
      pageId: page.id,
      folderId: null,
      name: page.name,
      meta: countNodes(page.items) + ' 项',
      icon: PAGE_SVG
    }));
    wrap.appendChild(row);

    var children = folderTreeChildren(page.items, page.id);
    if (children) wrap.appendChild(children);
    return wrap;
  }

  function renderMoveTree() {
    moveTree.textContent = '';
    if (!transfer) return;
    state.pages.forEach(function (page) {
      moveTree.appendChild(pageTreeNode(page));
    });
  }

  function openTransferDialog(nodeId, mode) {
    var node = findNode(nodeId);
    if (!node) return;
    transfer = { nodeId: nodeId, mode: mode, target: null };
    moveTitle.textContent = mode === 'copy' ? '复制到' : '移动到';
    moveNote.textContent = '选择「' + node.name + '」要'
      + (mode === 'copy' ? '复制到' : '移动到') + '的分页或文件夹。';
    moveConfirm.textContent = mode === 'copy' ? '复制到这里' : '移动到这里';
    moveConfirm.disabled = true;
    renderMoveTree();
    moveDialog.showModal();
  }

  function performTransfer(nodeId, target, mode) {
    var source = locateNode(nodeId);
    if (!source) return;
    var destItems = destinationItems(target);
    if (!destItems) {
      toast('目标位置不可用');
      return;
    }

    var node = source.node;
    if (node.type === 'folder') {
      var destFolder = target.folderId ? findNode(target.folderId) : null;
      if (destFolder && nodeContains(node, destFolder.id)) {
        toast('不能放进自己或子文件夹');
        return;
      }
    }

    if (mode === 'copy') {
      var copied = clone(node);
      regenerateIds(copied);
      destItems.push(copied);
      saveState();
      renderBoard();
      toast('已复制「' + node.name + '」');
      return;
    }

    if (destItems === source.items) {
      toast('已经在当前位置');
      return;
    }

    source.items.splice(source.index, 1);
    destItems.push(node);
    saveState();
    renderBoard();
    toast('已移动「' + node.name + '」');
  }

  moveConfirm.addEventListener('click', function () {
    if (!transfer || !transfer.target) return;
    var current = transfer;
    transfer = null;
    moveDialog.close();
    performTransfer(current.nodeId, current.target, current.mode);
  });

  moveDialog.addEventListener('close', function () { transfer = null; });

  /* ---------- context menu ---------- */

  function openCtxMenu(entries, x, y) {
    closeCtxMenu();
    ctxMenu.textContent = '';

    entries.forEach(function (entry) {
      if (entry.separator) {
        var sep = document.createElement('div');
        sep.className = 'ctx-sep';
        ctxMenu.appendChild(sep);
        return;
      }
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'ctx-item' + (entry.danger ? ' is-danger' : '');
      item.setAttribute('role', 'menuitem');
      item.textContent = entry.label;
      item.addEventListener('click', function () {
        closeCtxMenu();
        entry.run();
      });
      ctxMenu.appendChild(item);
    });

    ctxMenu.hidden = false;
    var width = ctxMenu.offsetWidth;
    var height = ctxMenu.offsetHeight;
    var left = Math.max(8, Math.min(x, window.innerWidth - width - 12));
    var top = Math.max(8, Math.min(y, window.innerHeight - height - 12));
    ctxMenu.style.left = left + 'px';
    ctxMenu.style.top = top + 'px';

    var first = ctxMenu.querySelector('button');
    if (first) {
      try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); }
    }
  }

  function closeCtxMenu() {
    if (!ctxMenu.hidden) {
      ctxMenu.hidden = true;
      ctxMenu.textContent = '';
    }
  }

  function openNodeMenu(id, x, y) {
    var node = findNode(id);
    if (!node) return;

    var entries;
    if (node.type === 'folder') {
      entries = [
        { label: '打开', run: function () { activateNode(node.id); } },
        { label: '重命名', run: function () { renameFolder(node); } },
        { label: '移动到…', run: function () { openTransferDialog(node.id, 'move'); } },
        { label: '复制到…', run: function () { openTransferDialog(node.id, 'copy'); } },
        { separator: true },
        { label: '删除', danger: true, run: function () { deleteNode(node); } }
      ];
    } else {
      entries = [
        { label: '打开', run: function () { activateNode(node.id); } },
        { label: '编辑', run: function () { openSiteDialog(node.id); } },
        { label: '移动到…', run: function () { openTransferDialog(node.id, 'move'); } },
        { label: '复制到…', run: function () { openTransferDialog(node.id, 'copy'); } },
        { separator: true },
        { label: '删除', danger: true, run: function () { deleteNode(node); } }
      ];
    }
    openCtxMenu(entries, x, y);
  }

  function openCreateMenu(x, y) {
    openCtxMenu([
      { label: '新增网站', run: function () { openSiteDialog(null); } },
      { label: '新增文件夹', run: createFolder }
    ], x, y);
  }

  function openPageMenu(pageId, x, y) {
    var page = findPage(pageId);
    if (!page) return;
    openCtxMenu([
      { label: '重命名分页', run: function () { renamePage(page); } },
      { label: '删除分页', danger: true, run: function () { deletePage(page); } }
    ], x, y);
  }

  ctxMenu.addEventListener('keydown', function (event) {
    var items = Array.prototype.slice.call(ctxMenu.querySelectorAll('button'));
    if (!items.length) return;
    var index = items.indexOf(document.activeElement);
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      items[(index + 1) % items.length].focus();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      items[(index - 1 + items.length) % items.length].focus();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      closeCtxMenu();
    }
  });

  document.addEventListener('pointerdown', function (event) {
    if (ctxMenu.hidden) return;
    if (ctxMenu.contains(event.target)) return;
    closeCtxMenu();
  }, true);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !ctxMenu.hidden) closeCtxMenu();
  });

  window.addEventListener('scroll', function () {
    closeCtxMenu();
    if (activeLinkMenu) closeLinkMenu();
  }, true);

  window.addEventListener('resize', function () {
    closeCtxMenu();
    if (activeLinkMenu) closeLinkMenu();
  });

  /* ---------- multi-link menu ---------- */

  function hostOf(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '');
    } catch (e) {
      return '';
    }
  }

  function positionLinkMenu(anchor) {
    var rect = anchor.getBoundingClientRect();
    var width = linkMenu.offsetWidth;
    var height = linkMenu.offsetHeight;
    var left = rect.left + rect.width / 2 - width / 2;
    left = Math.min(Math.max(12, left), window.innerWidth - width - 12);
    var top = rect.bottom + 8;
    if (top + height > window.innerHeight - 12) {
      top = rect.top - height - 8;
    }
    top = Math.max(12, top);
    linkMenu.style.left = left + 'px';
    linkMenu.style.top = top + 'px';
  }

  function openLinkMenu(node, anchor) {
    if (!node || node.links.length < 2) return;
    if (activeLinkMenu && activeLinkMenu.id === node.id) {
      closeLinkMenu();
      return;
    }

    closeLinkMenu();
    linkMenu.textContent = '';

    node.links.forEach(function (item, index) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'link-menu-item';
      button.setAttribute('role', 'menuitem');

      var label = document.createElement('span');
      label.className = 'link-menu-label od-truncate';
      label.textContent = item.label || ('链接 ' + (index + 1));

      var host = document.createElement('span');
      host.className = 'link-menu-host od-truncate';
      host.textContent = hostOf(item.url);

      button.appendChild(label);
      button.appendChild(host);
      button.addEventListener('click', function () {
        closeLinkMenu();
        openUrl(item.url);
      });
      linkMenu.appendChild(button);
    });

    linkMenu.hidden = false;
    activeLinkMenu = { id: node.id, anchor: anchor };
    anchor.setAttribute('aria-expanded', 'true');
    positionLinkMenu(anchor);
    var first = linkMenu.querySelector('button');
    if (first) first.focus();
  }

  function closeLinkMenu() {
    if (activeLinkMenu && activeLinkMenu.anchor) {
      activeLinkMenu.anchor.setAttribute('aria-expanded', 'false');
    }
    activeLinkMenu = null;
    linkMenu.hidden = true;
  }

  document.addEventListener('click', function (event) {
    if (!activeLinkMenu) return;
    if (linkMenu.contains(event.target)) return;
    if (activeLinkMenu.anchor && activeLinkMenu.anchor.contains(event.target)) return;
    closeLinkMenu();
  });

  linkMenu.addEventListener('keydown', function (event) {
    var items = Array.prototype.slice.call(linkMenu.querySelectorAll('button'));
    if (!items.length) return;
    var index = items.indexOf(document.activeElement);
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      items[(index + 1) % items.length].focus();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      items[(index - 1 + items.length) % items.length].focus();
    } else if (event.key === 'Escape') {
      var anchor = activeLinkMenu ? activeLinkMenu.anchor : null;
      closeLinkMenu();
      if (anchor) anchor.focus();
    }
  });

  /* ---------- click activation ---------- */

  tileGrid.addEventListener('click', function (event) {
    if (suppressClick) {
      suppressClick = false;
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    var tile = event.target.closest ? event.target.closest('[data-node-id]') : null;
    if (!tile) return;
    activateNode(tile.dataset.nodeId);
  }, true);

  pageTabs.addEventListener('click', function (event) {
    if (suppressClick) {
      suppressClick = false;
      event.preventDefault();
      return;
    }
    var tab = event.target.closest ? event.target.closest('[data-page-tab]') : null;
    if (!tab) return;
    var id = tab.dataset.pageTab;
    if (id === nav.pageId) {
      nav.path = [];
      renderBoard();
      return;
    }
    nav.pageId = id;
    nav.path = [];
    renderBoard();
  });

  crumbEl.addEventListener('click', function (event) {
    var back = event.target.closest ? event.target.closest('[data-crumb-back]') : null;
    if (back) {
      nav.path.pop();
      renderBoard();
      return;
    }
    var item = event.target.closest ? event.target.closest('[data-crumb-index]') : null;
    if (!item) return;
    var index = parseInt(item.dataset.crumbIndex, 10);
    nav.path = index < 0 ? [] : nav.path.slice(0, index + 1);
    renderBoard();
  });

  prevBtn.addEventListener('click', function () { goPage(-1); });
  nextBtn.addEventListener('click', function () { goPage(1); });

  /* ---------- context menu triggers ---------- */

  boardEl.addEventListener('contextmenu', function (event) {
    var tab = event.target.closest ? event.target.closest('[data-page-tab]') : null;
    if (tab) {
      event.preventDefault();
      openPageMenu(tab.dataset.pageTab, event.clientX, event.clientY);
      return;
    }
    var tile = event.target.closest ? event.target.closest('[data-node-id]') : null;
    if (tile) {
      event.preventDefault();
      openNodeMenu(tile.dataset.nodeId, event.clientX, event.clientY);
      return;
    }
    if (event.target.closest && event.target.closest('.board-viewport')) {
      event.preventDefault();
      openCreateMenu(event.clientX, event.clientY);
    }
  });

  /* ---------- pointer gestures: drag & swipe & long press ---------- */

  function clearDropMarks() {
    var marks = document.querySelectorAll('.drop-before, .drop-after, .drop-into, .drop-page');
    for (var i = 0; i < marks.length; i += 1) {
      marks[i].classList.remove('drop-before', 'drop-after', 'drop-into', 'drop-page');
    }
  }

  function nodeContains(root, id) {
    if (!root) return false;
    if (root.id === id) return true;
    if (root.type !== 'folder') return false;
    for (var i = 0; i < root.items.length; i += 1) {
      if (nodeContains(root.items[i], id)) return true;
    }
    return false;
  }

  function removeGhost() {
    if (dragState && dragState.ghost) {
      dragState.ghost.remove();
      dragState.ghost = null;
    }
  }

  function insertionRef(x, y) {
    var children = tileGrid.children;
    for (var i = 0; i < children.length; i += 1) {
      var li = children[i];
      if (dragState && li === dragState.li) continue;
      var rect = li.getBoundingClientRect();
      if (y < rect.top + 2) return li;
      if (y <= rect.bottom + 2 && x < rect.left + rect.width / 2) return li;
    }
    return null;
  }

  function movePlaceholder(ref) {
    if (!dragState || !dragState.li) return;
    var item = dragState.li;
    if (ref) {
      if (item.nextElementSibling !== ref) tileGrid.insertBefore(item, ref);
    } else if (tileGrid.lastElementChild !== item) {
      tileGrid.appendChild(item);
    }
  }

  function updateDropTarget(x, y) {
    clearDropMarks();
    dropTarget = null;
    if (!dragState || !dragState.active) return;

    var el = document.elementFromPoint(x, y);
    if (!el) return;

    var tab = el.closest ? el.closest('[data-page-tab]') : null;
    if (tab && tab.dataset.pageTab !== nav.pageId) {
      tab.classList.add('drop-page');
      dropTarget = { type: 'page', id: tab.dataset.pageTab };
      return;
    }

    var viewportRect = boardViewport.getBoundingClientRect();
    if (x < viewportRect.left || x > viewportRect.right || y < viewportRect.top || y > viewportRect.bottom) return;

    var tile = el.closest ? el.closest('[data-node-id]') : null;
    if (tile && tile !== dragState.el && tile.dataset.nodeType === 'folder') {
      var rect = tile.getBoundingClientRect();
      var inCenter = x > rect.left + rect.width * 0.22 && x < rect.left + rect.width * 0.78
        && y > rect.top + rect.height * 0.18 && y < rect.top + rect.height * 0.82;
      if (inCenter) {
        var sourceNode = findNode(dragState.nodeId);
        if (!nodeContains(sourceNode, tile.dataset.nodeId)) {
          tile.classList.add('drop-into');
          dropTarget = { type: 'into', id: tile.dataset.nodeId };
          return;
        }
      }
    }

    var ref = insertionRef(x, y);
    dropTarget = { type: 'order', ref: ref };
    movePlaceholder(ref);
  }

  function commitOrderFromDom() {
    var ids = [];
    for (var i = 0; i < tileGrid.children.length; i += 1) {
      var id = tileGrid.children[i].dataset.nodeId;
      if (id) ids.push(id);
    }
    var items = currentItems();
    var map = {};
    items.forEach(function (node) { map[node.id] = node; });
    var ordered = [];
    ids.forEach(function (id) { if (map[id]) ordered.push(map[id]); });
    if (!ordered.length) return;
    items.length = 0;
    ordered.forEach(function (node) { items.push(node); });
    saveState();
    renderBoard();
  }

  function finishDrag(x, y) {
    updateDropTarget(x, y);
    var target = dropTarget;
    dropTarget = null;
    if (!dragState) return;

    var items = currentItems();
    var from = -1;
    for (var i = 0; i < items.length; i += 1) {
      if (items[i].id === dragState.nodeId) { from = i; break; }
    }

    if (!target) {
      renderBoard();
      return;
    }

    if (target.type === 'page') {
      if (from < 0) return;
      var page = findPage(target.id);
      if (!page) return;
      var movedToPage = items.splice(from, 1)[0];
      page.items.push(movedToPage);
      saveState();
      renderBoard();
      toast('已移动到「' + page.name + '」');
      return;
    }

    if (target.type === 'into') {
      if (from < 0) return;
      var folder = findNode(target.id);
      if (!folder || folder.type !== 'folder') return;
      var movedInto = items.splice(from, 1)[0];
      folder.items.push(movedInto);
      saveState();
      renderBoard();
      toast('已移入「' + folder.name + '」');
      return;
    }

    commitOrderFromDom();
  }

  function makeGhost(tile) {
    var rect = tile.getBoundingClientRect();
    var wrap = document.createElement('div');
    wrap.className = 'drag-ghost';
    wrap.setAttribute('aria-hidden', 'true');
    wrap.style.left = rect.left + 'px';
    wrap.style.top = rect.top + 'px';
    wrap.style.width = rect.width + 'px';
    wrap.style.height = rect.height + 'px';

    var clone = tile.cloneNode(true);
    clone.classList.remove('is-dragging', 'drop-into', 'drop-before', 'drop-after');
    clone.removeAttribute('data-node-id');
    clone.removeAttribute('data-node-type');
    clone.style.width = '100%';
    clone.style.height = '100%';
    wrap.appendChild(clone);
    document.body.appendChild(wrap);

    dragState.ghost = wrap;
    dragState.offsetX = dragState.startX - rect.left;
    dragState.offsetY = dragState.startY - rect.top;
  }

  function resetDragVisual() {
    if (dragState && dragState.el) dragState.el.classList.remove('is-dragging');
    removeGhost();
    document.body.classList.remove('is-dragging');
    clearDropMarks();
  }

  boardViewport.addEventListener('pointerdown', function (event) {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    var tile = event.target.closest ? event.target.closest('[data-node-id]') : null;

    dragState = {
      nodeId: tile ? tile.dataset.nodeId : null,
      el: tile,
      li: tile ? tile.parentElement : null,
      pointerId: event.pointerId,
      pointerType: event.pointerType || 'mouse',
      startX: event.clientX,
      startY: event.clientY,
      active: false,
      moved: false,
      ghost: null,
      offsetX: 0,
      offsetY: 0
    };
    dropTarget = null;

    window.clearTimeout(longPressTimer);
    longPressTimer = window.setTimeout(function () {
      if (!dragState || dragState.moved || dragState.active) return;
      var x = dragState.startX;
      var y = dragState.startY;
      var nodeId = dragState.nodeId;
      dragState = null;
      suppressNextClick();
      if (nodeId) openNodeMenu(nodeId, x, y);
      else openCreateMenu(x, y);
    }, 520);
  });

  window.addEventListener('pointermove', function (event) {
    if (!dragState || event.pointerId !== dragState.pointerId) return;

    var dx = event.clientX - dragState.startX;
    var dy = event.clientY - dragState.startY;
    if (!dragState.moved && Math.sqrt(dx * dx + dy * dy) > 6) {
      dragState.moved = true;
      window.clearTimeout(longPressTimer);
    }
    if (!dragState.moved) return;

    if (dragState.nodeId && dragState.pointerType !== 'touch') {
      if (!dragState.active) {
        dragState.active = true;
        if (dragState.el) dragState.el.classList.add('is-dragging');
        document.body.classList.add('is-dragging');
        makeGhost(dragState.el);
      }
      if (event.cancelable) event.preventDefault();
      if (dragState.ghost) {
        dragState.ghost.style.transform = 'translate3d(' + dx + 'px,' + dy + 'px,0) scale(1.06)';
      }
      updateDropTarget(event.clientX, event.clientY);
    }
  }, { passive: false });

  window.addEventListener('pointerup', function (event) {
    if (!dragState || event.pointerId !== dragState.pointerId) return;
    window.clearTimeout(longPressTimer);

    var gesture = dragState;

    if (gesture.active) {
      finishDrag(event.clientX, event.clientY);
      suppressNextClick();
    } else if (gesture.moved) {
      var dx = event.clientX - gesture.startX;
      var dy = event.clientY - gesture.startY;
      var canSwipe = !gesture.nodeId || gesture.pointerType === 'touch';
      if (canSwipe && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        suppressNextClick();
        goPage(dx < 0 ? 1 : -1);
      }
    }

    removeGhost();
    if (gesture.el) gesture.el.classList.remove('is-dragging');
    document.body.classList.remove('is-dragging');
    clearDropMarks();
    dragState = null;
  });

  window.addEventListener('pointercancel', function () {
    window.clearTimeout(longPressTimer);
    resetDragVisual();
    dragState = null;
  });

  boardViewport.addEventListener('wheel', function (event) {
    if (!event.shiftKey) return;
    event.preventDefault();
    var delta = event.deltaY !== 0 ? event.deltaY : event.deltaX;
    if (!delta) return;
    goPage(delta > 0 ? 1 : -1);
  }, { passive: false });

  /* ---------- pointer sortable (page tabs & page manager) ---------- */

  function enableSortable(container, options) {
    var drag = null;

    container.addEventListener('pointerdown', function (event) {
      if (event.pointerType === 'touch') return;
      if (event.button !== 0) return;
      var item = event.target.closest ? event.target.closest(options.item) : null;
      if (!item || !container.contains(item)) return;
      if (options.handle && !event.target.closest(options.handle)) return;
      drag = {
        item: item,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        active: false
      };
    });

    window.addEventListener('pointermove', function (event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      var dx = event.clientX - drag.startX;
      var dy = event.clientY - drag.startY;

      if (!drag.active) {
        if (Math.sqrt(dx * dx + dy * dy) < 6) return;
        drag.active = true;
        drag.item.classList.add('is-dragging');
        document.body.classList.add(options.bodyClass || 'is-dragging');
      }
      if (event.cancelable) event.preventDefault();

      var children = container.querySelectorAll(options.item);
      var value = options.horizontal ? event.clientX : event.clientY;
      var ref = null;
      for (var i = 0; i < children.length; i += 1) {
        var child = children[i];
        if (child === drag.item) continue;
        var rect = child.getBoundingClientRect();
        var mid = options.horizontal ? rect.left + rect.width / 2 : rect.top + rect.height / 2;
        if (value < mid) { ref = child; break; }
      }
      if (ref) {
        if (drag.item.nextElementSibling !== ref) container.insertBefore(drag.item, ref);
      } else if (container.lastElementChild !== drag.item) {
        container.appendChild(drag.item);
      }
    }, { passive: false });

    window.addEventListener('pointerup', function (event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      var finished = drag;
      drag = null;
      finished.item.classList.remove('is-dragging');
      document.body.classList.remove(options.bodyClass || 'is-dragging');
      if (finished.active) {
        suppressNextClick();
        if (options.onCommit) options.onCommit();
      }
    });

    window.addEventListener('pointercancel', function (event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      drag.item.classList.remove('is-dragging');
      document.body.classList.remove(options.bodyClass || 'is-dragging');
      drag = null;
    });
  }

  function reorderPages(ids) {
    var map = {};
    state.pages.forEach(function (page) { map[page.id] = page; });
    var next = [];
    ids.forEach(function (id) { if (map[id]) next.push(map[id]); });
    if (next.length !== state.pages.length) return false;
    state.pages.length = 0;
    next.forEach(function (page) { state.pages.push(page); });
    return true;
  }

  function commitTabOrder() {
    var ids = [];
    var tabs = pageTabs.querySelectorAll('[data-page-tab]');
    for (var i = 0; i < tabs.length; i += 1) ids.push(tabs[i].dataset.pageTab);
    if (!reorderPages(ids)) return;
    saveState();
    renderBoard();
    renderPageManager();
    toast('已调整分页顺序');
  }

  function commitManageOrder() {
    var ids = [];
    var rows = pageManage.querySelectorAll('[data-page-id]');
    for (var i = 0; i < rows.length; i += 1) ids.push(rows[i].dataset.pageId);
    if (!reorderPages(ids)) return;
    saveState();
    renderBoard();
    renderPageManager();
    toast('已调整分页顺序');
  }

  enableSortable(pageTabs, {
    item: '[data-page-tab]',
    horizontal: true,
    bodyClass: 'is-dragging',
    onCommit: commitTabOrder
  });

  enableSortable(pageManage, {
    item: '.pm-row',
    handle: '.pm-grip',
    horizontal: false,
    bodyClass: 'is-row-dragging',
    onCommit: commitManageOrder
  });

  /* ---------- site dialog ---------- */

  function clearFieldError(fieldName) {
    var wrap = siteForm.querySelector('[data-field="' + fieldName + '"]');
    if (!wrap) return;
    wrap.classList.remove('invalid');
    var error = wrap.querySelector('.field-error');
    var input = wrap.querySelector('input');
    if (error) { error.hidden = true; error.textContent = ''; }
    if (input) { input.removeAttribute('aria-invalid'); input.removeAttribute('aria-describedby'); }
  }

  function setFieldError(fieldName, message) {
    var wrap = siteForm.querySelector('[data-field="' + fieldName + '"]');
    if (!wrap) return;
    var error = wrap.querySelector('.field-error');
    var input = wrap.querySelector('input');
    wrap.classList.toggle('invalid', Boolean(message));
    if (!error || !input) return;
    error.textContent = message || '';
    error.hidden = !message;
    if (message) {
      input.setAttribute('aria-invalid', 'true');
      input.setAttribute('aria-describedby', error.id);
    } else {
      input.removeAttribute('aria-invalid');
      input.removeAttribute('aria-describedby');
    }
  }

  function validateName(showEmpty) {
    var value = siteName.value.trim();
    if (!value) {
      if (showEmpty) setFieldError('name', '请输入名称');
      return !showEmpty;
    }
    if (value.length > 16) {
      setFieldError('name', '名称请控制在 16 个字符以内');
      return false;
    }
    clearFieldError('name');
    return true;
  }

  function clearLinksError() {
    siteLinksError.hidden = true;
    siteLinksError.textContent = '';
    var inputs = linkList.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i += 1) inputs[i].classList.remove('invalid');
  }

  function syncLinkRows() {
    var rows = linkList.querySelectorAll('[data-link]');
    var multi = rows.length > 1;
    linkList.dataset.multi = multi ? 'true' : 'false';
    for (var i = 0; i < rows.length; i += 1) {
      var remove = rows[i].querySelector('.link-remove');
      if (remove) remove.hidden = !multi;
    }
    clearLinksError();
  }

  function createLinkRow(label, url) {
    var row = document.createElement('div');
    row.className = 'link-row';
    row.dataset.link = '';

    var labelInput = document.createElement('input');
    labelInput.type = 'text';
    labelInput.className = 'link-label';
    labelInput.placeholder = '标签';
    labelInput.maxLength = 10;
    labelInput.autocomplete = 'off';
    labelInput.dataset.role = 'label';
    labelInput.setAttribute('aria-label', '链接标签');
    labelInput.value = label || '';

    var urlInput = document.createElement('input');
    urlInput.type = 'text';
    urlInput.className = 'link-url';
    urlInput.placeholder = 'https://example.com';
    urlInput.inputMode = 'url';
    urlInput.autocomplete = 'off';
    urlInput.dataset.role = 'url';
    urlInput.setAttribute('aria-label', '链接网址');
    urlInput.value = url || '';

    var remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'link-remove';
    remove.setAttribute('aria-label', '删除这个链接');
    remove.innerHTML = REMOVE_SVG;
    remove.addEventListener('click', function () {
      row.remove();
      syncLinkRows();
    });

    labelInput.addEventListener('input', clearLinksError);
    urlInput.addEventListener('input', clearLinksError);

    row.appendChild(labelInput);
    row.appendChild(urlInput);
    row.appendChild(remove);
    return row;
  }

  function resetLinkRows(links) {
    linkList.textContent = '';
    var list = (links && links.length) ? links : [{ label: '', url: '' }];
    list.forEach(function (link) {
      linkList.appendChild(createLinkRow(link.label, link.url));
    });
    syncLinkRows();
  }

  function collectLinks() {
    var rows = Array.prototype.slice.call(linkList.querySelectorAll('[data-link]'));
    var multi = rows.length > 1;
    var list = [];
    var ok = true;
    var firstBad = null;

    rows.forEach(function (row) {
      var labelInput = row.querySelector('[data-role="label"]');
      var urlInput = row.querySelector('[data-role="url"]');
      var label = labelInput.value.trim();
      var url = normalizeUrl(urlInput.value);

      labelInput.classList.remove('invalid');
      urlInput.classList.remove('invalid');

      if (multi && !label) {
        labelInput.classList.add('invalid');
        ok = false;
        if (!firstBad) firstBad = labelInput;
      }
      if (!url) {
        urlInput.classList.add('invalid');
        ok = false;
        if (!firstBad) firstBad = urlInput;
      }

      list.push({ label: multi ? label : '', url: url || '' });
    });

    if (!ok) {
      siteLinksError.textContent = multi ? '每个链接都要填写标签和有效网址' : '请填写有效的网址';
      siteLinksError.hidden = false;
      if (firstBad) firstBad.focus();
      return null;
    }

    siteLinksError.hidden = true;
    siteLinksError.textContent = '';
    return list;
  }

  function openSiteDialog(id) {
    var node = id ? findNode(id) : null;
    if (node && node.type !== 'site') node = null;
    editingSiteId = node ? node.id : null;
    siteTitle.textContent = node ? '编辑网站' : '新增网站';
    siteName.value = node ? node.name : '';
    resetLinkRows(node ? node.links : null);
    clearFieldError('name');
    siteDialog.showModal();
    window.requestAnimationFrame(function () { siteName.focus(); });
  }

  addLinkBtn.addEventListener('click', function () {
    var row = createLinkRow('', '');
    linkList.appendChild(row);
    syncLinkRows();
    var labelInput = row.querySelector('[data-role="label"]');
    if (labelInput) labelInput.focus();
  });

  siteForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!validateName(true)) { siteName.focus(); return; }
    var links = collectLinks();
    if (!links) return;

    var name = siteName.value.trim();
    var focusId;

    if (editingSiteId) {
      var node = findNode(editingSiteId);
      if (node && node.type === 'site') {
        node.name = name;
        node.links = links;
      }
      focusId = editingSiteId;
    } else {
      var newSite = siteNode(uid(), name, links);
      currentItems().push(newSite);
      focusId = newSite.id;
    }

    saveState();
    siteDialog.close();
    renderBoard(focusId);
    toast(editingSiteId ? '已更新网站' : '已新增网站');
    editingSiteId = null;
  });

  siteName.addEventListener('blur', function () { validateName(false); });
  siteName.addEventListener('input', function () { clearFieldError('name'); });

  /* ---------- prompt dialog ---------- */

  function askPrompt(options) {
    promptTitle.textContent = options.title;
    promptLabel.textContent = options.label || '名称';
    promptInput.value = options.value || '';
    promptError.hidden = true;
    promptError.textContent = '';
    promptHandler = options.onOk || null;
    promptDialog.showModal();
    window.setTimeout(function () {
      promptInput.focus();
      promptInput.select();
    }, 30);
  }

  promptForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var value = promptInput.value.trim();
    if (!value) {
      promptError.textContent = '请输入名称';
      promptError.hidden = false;
      promptInput.focus();
      return;
    }
    var action = promptHandler;
    promptHandler = null;
    promptDialog.close();
    if (action) action(value.slice(0, 16));
  });

  promptInput.addEventListener('input', function () {
    promptError.hidden = true;
    promptError.textContent = '';
  });

  promptDialog.addEventListener('close', function () { promptHandler = null; });

  /* ---------- settings ---------- */

  function syncSettings() {
    applyTheme();
    engineSelect.value = state.engine;
    renderPageManager();
  }

    pageManage.textContent = '';

    state.pages.forEach(function (page) {

  /* ---------- export / import ---------- */

  function totalSites(pages) {
    var total = 0;
    pages.forEach(function (page) {
      total += countSitesIn(page.items);
    });
    return total;
  }

  function countSitesIn(items) {
    var total = 0;
    for (var i = 0; i < items.length; i += 1) {
      if (items[i].type === 'folder') total += countSitesIn(items[i].items);
      else total += 1;
    }
    return total;
  }

  function exportData() {
    var payload = {
      app: 'waymarktag-start',
      version: 3,
      exportedAt: new Date().toISOString(),
      theme: state.theme,
      engine: state.engine,
      pages: state.pages
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var stamp = String(now.getFullYear()) + pad(now.getMonth() + 1) + pad(now.getDate())
      + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    // 同一秒内多次导出也不会重名
    var rand = Math.random().toString(36).slice(2, 6);
    while (rand.length < 4) rand += '0';
    var link = document.createElement('a');
    link.href = url;
    link.download = 'WayMarkTag-' + stamp + '-' + rand + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已导出备份文件');
  }

  $('#exportBtn').addEventListener('click', exportData);

  $('#importBtn').addEventListener('click', function () {
    importFile.value = '';
    importFile.click();
  });

  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    if (!file) return;

    file.text().then(function (text) {
      var parsed;
      try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
      var incoming = sanitize(parsed);
      if (!incoming) {
        toast('文件格式不正确，未导入任何内容');
        return;
      }
      askConfirm({
        title: '导入备份',
        message: '将用备份中的 ' + incoming.pages.length + ' 个分页、' + totalSites(incoming.pages)
          + ' 个网站替换当前数据。',
        okLabel: '导入',
        onOk: function () {
          state = incoming;
          saveState();
          applyState(true);
          toast('导入完成');
        }
      });
    }).catch(function () {
      toast('读取文件失败，请重试');
    });
  });

  /* ---------- confirm ---------- */

  function askConfirm(options) {
    confirmTitle.textContent = options.title;
    confirmMsg.textContent = options.message;
    confirmOk.textContent = options.okLabel || '确认';
    confirmOk.className = 'btn ' + (options.danger ? 'btn-danger-solid' : 'btn-primary');
    confirmHandler = options.onOk || null;
    confirmDialog.showModal();

  $('#confirmCancel').addEventListener('click', function () {
    confirmHandler = null;
    confirmDialog.close();
  });

  confirmOk.addEventListener('click', function () {
    var action = confirmHandler;
    confirmHandler = null;
    confirmDialog.close();
    if (action) action();
  });

  confirmDialog.addEventListener('close', function () { confirmHandler = null; });

  /* ---------- clock ---------- */

  var clockTime = $('#clockTime');
  var clockSec = $('#clockSec');
  var greetingEl = $('#greeting');
  var todayEl = $('#today');
  var lastMinute = -1;

  function greetingFor(hour) {
    if (hour < 5) return '夜深了，注意休息';
    if (hour < 9) return '早上好';
    if (hour < 12) return '上午好';
    if (hour < 14) return '中午好';
    if (hour < 18) return '下午好';
    return '晚上好';
  }

  function tick() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var ss = String(now.getSeconds()).padStart(2, '0');
    clockTime.textContent = hh + ':' + mm;
    clockTime.setAttribute('datetime', now.getFullYear() + '-'
      + String(now.getMonth() + 1).padStart(2, '0') + '-'
      + String(now.getDate()).padStart(2, '0') + 'T' + hh + ':' + mm);
    clockSec.textContent = ss;

    if (now.getMinutes() !== lastMinute) {
      lastMinute = now.getMinutes();
      greetingEl.textContent = greetingFor(now.getHours());
      todayEl.textContent = (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 星期'
        + '日一二三四五六'.charAt(now.getDay());
    }
  }

  /* ---------- search ---------- */

  searchForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var query = searchInput.value.trim();
    if (!query) {
      toast('先输入要搜索的内容');
      searchInput.focus();
      return;
    }
    var target;
    if (/^[a-zA-Z][\w.-]*\.[a-zA-Z]{2,}(\/\S*)?$/.test(query) && !/\s/.test(query)) {
      target = 'https://' + query;
    } else {
      target = currentEngine().url + encodeURIComponent(query);
    }
    openUrl(target);
  });

  /* ---------- init ---------- */

  function applyState(resetView) {
    if (resetView) {
      nav.pageId = state.pages[0].id;
      nav.path = [];
    }
    ensureNav();
    applyTheme();
    renderEngine();
    renderBoard();
    renderPageManager();
  }

  applyState(true);
  tick();
  window.setInterval(tick, 1000);
})();
</script>
</body>
</html>
